[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nmt-engine"
version = "0.1.0"
description = "Outside-in product-strategy engine on public data and graded synthetic evidence"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "pandas>=2.1",
  "pydantic>=2.5,<3",
  "typer>=0.12",
  "pint>=0.23",
  "httpx>=0.27",
  "networkx>=3.2",
  "datasketch>=1.6",
  "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "hypothesis>=6.100",
  "vcrpy>=6",
  "ruff>=0.5",
]

[project.scripts]
nmt = "nmt_engine.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nmt_engine = ["py.typed", "**/*.txt", "**/*.j2", "**/*.json", "**/*.js"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
